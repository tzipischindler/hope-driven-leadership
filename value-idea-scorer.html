<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Value Based Idea Prioritization</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useEffect, useRef, useState } = React;



const CRITERIA = [
  {
    key: 'value1',
    label: 'Do it right rather than fast',
    hint: 'Is this a sustainable solution?',
  },
  {
    key: 'value2',
    label: 'Respect the human',
    hint: 'Will this have a positive impact on people and help diverge their resources to do good?',
    scale: ['Anecdotal only', 'Adjacent category', 'Some direct signal', 'Multiple sources', 'Strong, measurable'],
  },
  {
    key: 'value3',
    label: 'We make complex simple',
    hint: 'Do people currently patch it with something clunky (workaround, manual process)?',
  },
  {
    key: 'value4',
    label: 'Trust through transparency',
    hint: 'Will we create more transparency for our users?',
  },
  {
    key: 'KPI',
    label: 'Clean completion rate',
    hint: 'Contributes to  our KPI of processes completed with no manual rework',
  },
  {
    key: 'time',
    label: 'Time sensitivity',
    hint: 'Is there a time pressure? A reason to do it right now, or earlier?',
  },
];

const WEIGHTS = {
  'value1': 1,
  'value2': 1,
  'value3': 1,
  'value4': 1,
  'KPI': 3,
  'time': 1,
};

const EFFORT_SCORES = {
  'X-SMALL': 0.5,
  'SMALL': 1,
  'MEDIUM': 2,
  'LARGE': 4,
  'X-LARGE': 6,
};
const EFFORT_LEVELS = Object.keys(EFFORT_SCORES);

const emptyScores = () =>
  Object.fromEntries(CRITERIA.map((c) => [c.key, 3]));

const IS_DEMO = new URLSearchParams(window.location.search).get('mode') === 'demo';

const STARTER_IDEAS = [
  {
    id: 1,
    title: 'Regulatory rules engine refactor',
    problem:
      'Every regulatory rule (notice periods, required documents, deadlines) is currently hard-coded inside individual workflows. When a regulation changes, an engineer has to find every place it\'s used, edit each one, and hope nothing was missed. Last quarter a notice-period change took three weeks to roll out and one workflow still had the old value for days afterward.',
    solution:
      'If rules live in one versioned, central place that workflows read from, regulatory changes will ship faster and with fewer mistakes, and the team will be able to say exactly which rule version applied to any past case.',
    customerSegments: 'Our own team',
    existingAlternatives: 'We have to do lots of manual work to update every time, and the opportunity cost is huge',
    effort: 'LARGE',
    scores: {
      'value1': 5,
      'value2': 5,
      'value3': 5,
      'value4': 1,
      'KPI': 2,
      'time': 4,
    },
  },
 


  {
    id: 2,
    title: 'Proactive deadline alerts for work-permit renewals',
    problem:
      'In customer interviews and support tickets we hears the same story: HR managers track visa and work-permit expiry dates in spreadsheets, and twice last quarter a renewal was started too late, leaving an employee unable to work for a few days.',
    solution: 'If the system starts the renewal workflow automatically 90 days before expiry, instead of waiting for someone to remember, late renewals will drop sharply and HR will spend less time chasing dates.',
    customerSegments: 'End customer, employees on temporary work visa',
    existingAlternatives: 'Spreadsheet and reminders',
    effort: 'LARGE',
    scores: {
      'value1': 5,
      'value2': 4,
      'value3': 5,
      'value4': 1,
      'KPI': 4,
      'time': 4,
    },
  },
];

function calculatePriority(scores, weights, effort = 'MEDIUM') {
  const weightedSum = CRITERIA.reduce((acc, c) => acc + scores[c.key] * weights[c.key], 0);
  const maxWeightedSum = CRITERIA.reduce((acc, c) => acc + 5 * weights[c.key], 0);
  const effortScore = EFFORT_SCORES[effort] || EFFORT_SCORES.MEDIUM;
  const score = weightedSum / effortScore;
  const maxScore = maxWeightedSum / EFFORT_SCORES['X-SMALL'];
  const progress = maxScore ? Math.round((score / maxScore) * 100) : 0;
  return { score, progress };
}

function Slider({ criterion, value, onChange }) {
  const scaleLabel = criterion.scale ? criterion.scale[value - 1] : null;

  return (
    <div style={{ marginBottom: '18px' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: '4px' }}>
        <label
          className="criterion-label"
          style={{ fontSize: '14px', fontWeight: 600, color: '#2b2b26' }}
        >
          {criterion.label}
        </label>
        <span style={{ fontSize: '13px', color: '#8a7f6a', fontVariantNumeric: 'tabular-nums' }}>
          {scaleLabel || value}
        </span>
      </div>
      <p style={{ fontSize: '12px', color: '#9c927d', margin: '0 0 8px 0', lineHeight: 1.4 }}>{criterion.hint}</p>
      <input
        type="range"
        min={1}
        max={5}
        step={1}
        value={value}
        onChange={(e) => onChange(criterion.key, Number(e.target.value))}
        style={{
          width: '100%',
          accentColor: '#c7967d',
          height: '4px',
        }}
      />
    </div>
  );
}

function AutoResizeTextarea({ value, onChange, placeholder }) {
  const textareaRef = useRef(null);

  useEffect(() => {
    if (textareaRef.current) {
      textareaRef.current.style.height = 'auto';
      textareaRef.current.style.height = `${textareaRef.current.scrollHeight}px`;
    }
  }, [value]);

  const handleChange = (event) => {
    event.target.style.height = 'auto';
    event.target.style.height = `${event.target.scrollHeight}px`;
    onChange(event.target.value);
  };

  return (
    <textarea
      ref={textareaRef}
      value={value}
      onChange={handleChange}
      placeholder={placeholder}
      rows={1}
      className="idea-note-textarea"
    />
  );
}

function EffortScale({ value, onChange }) {
  return (
    <fieldset className="effort-scale">
      <legend>Effort</legend>
      <div className="effort-options">
        {EFFORT_LEVELS.map((level) => (
          <button
            key={level}
            type="button"
            className={`effort-option${value === level ? ' is-selected' : ''}`}
            aria-pressed={value === level}
            aria-label={`${level}, ${EFFORT_SCORES[level]} effort points`}
            onClick={() => onChange(level)}
          >
            <span>{level}</span>
            <small>{EFFORT_SCORES[level]}</small>
          </button>
        ))}
      </div>
    </fieldset>
  );
}

function IdeaCard({ idea, onUpdate, onDelete, isTop, weights }) {
  const { score, progress } = calculatePriority(idea.scores, weights, idea.effort);
  const noteFields = [
    { key: 'problem', label: 'Problem', placeholder: 'What problem are you solving?' },
    { key: 'solution', label: 'Solution', placeholder: 'What are you building to solve it?' },
    { key: 'customerSegments', label: 'Customer Segments', placeholder: 'Who specifically experiences this problem?' },
    { key: 'existingAlternatives', label: 'Existing Alternatives', placeholder: 'What do people use or do today instead?' },
  ];

  return (
    <div
      id={`idea-${idea.id}`}
  className="idea-card">
      {isTop && (
        <div className="top-idea-badge">
          Leading
        </div>
      )}

      <div style={{ display: 'flex', justifyContent: 'space-between', gap: '16px', marginBottom: '10px' }}>
        <input
          value={idea.title}
          onChange={(e) => onUpdate(idea.id, { ...idea, title: e.target.value })}
          placeholder="Idea title"
          className="idea-title"
        />
        <button
          onClick={() => onDelete(idea.id)}
          style={{
            border: 'none',
            background: 'transparent',
            color: '#b8ab8f',
            cursor: 'pointer',
            fontSize: '13px',
            padding: '2px 6px',
          }}
        >
          remove
        </button>
      </div>

      <div style={{ marginBottom: '16px' }}>
        {noteFields.map((field) => (
          <div key={field.key} style={{ marginBottom: '12px' }}>
            <label className="idea-note-label">
              {field.label}
            </label>
            <AutoResizeTextarea
              value={idea[field.key] || ''}
              onChange={(value) => onUpdate(idea.id, { ...idea, [field.key]: value })}
              placeholder={field.placeholder}
            />
          </div>
        ))}
      </div>

      <div style={{ display: 'flex', alignItems: 'center', gap: '14px', marginBottom: '18px' }}>
        <div
          style={{
            fontSize: '28px',
            fontWeight: 700,
            color: '#c7967d',
            minWidth: '58px',
          }}
        >
          {score.toFixed(2)}
        </div>
        <div style={{ flex: 1, height: '6px', background: '#e5ddd0', borderRadius: '3px', overflow: 'hidden' }}>
          <div
            style={{
              width: `${progress}%`,
              height: '100%',
              background: '#c7967d',
              borderRadius: '3px',
              transition: 'width 0.3s ease',
            }}
          />
        </div>
        <div style={{ fontSize: '12px', color: '#9c927d' }}>priority score</div>
      </div>

      {CRITERIA.map((c) => (
        <Slider
          key={c.key}
          criterion={c}
          value={idea.scores[c.key]}
          onChange={(key, val) => onUpdate(idea.id, { ...idea, scores: { ...idea.scores, [key]: val } })}
        />
      ))}
      <EffortScale
        value={idea.effort || 'MEDIUM'}
        onChange={(effort) => onUpdate(idea.id, { ...idea, effort })}
      />
    </div>
  );
}

function IdeaScorer() {
  const [ideas, setIdeas] = useState(() => (IS_DEMO ? STARTER_IDEAS : []));
  const [weights, setWeights] = useState(WEIGHTS);

  const updateWeight = (key, value) => {
    setWeights({ ...weights, [key]: Math.max(0, Number(value) || 0) });
  };

  const addIdea = () => {
    const id = Date.now();
    setIdeas([
      ...ideas,
      {
        id,
        title: 'New idea',
        problem: '',
        solution: '',
        customerSegments: '',
        existingAlternatives: '',
        scores: emptyScores(),
        effort: 'MEDIUM',
      },
    ]);
  };

  const updateIdea = (id, updated) => {
    setIdeas(ideas.map((i) => (i.id === id ? updated : i)));
  };

  const deleteIdea = (id) => {
    setIdeas(ideas.filter((i) => i.id !== id));
  };

  const ranked = [...ideas].sort((a, b) =>
    calculatePriority(b.scores, weights, b.effort).score - calculatePriority(a.scores, weights, a.effort).score
  );
  const topId = ranked.length > 1 ? ranked[0].id : null;
  const renderWeightInput = (criterion) => (
    <label key={criterion.key} className="weight-label">
      {criterion.label}
      <input
        className="weight-input"
        type="number"
        min="0"
        step="0.5"
        value={weights[criterion.key]}
        onChange={(e) => updateWeight(criterion.key, e.target.value)}
      />
    </label>
  );

  return (
    <div>
      <div className="scorer-page">
        <a className="scorer-back-link" href="prioritization.html">
          ← Back
        </a>
        <header className="scorer-header">
        <h1>
          Which Story/Task Should We Do First?
        </h1>
        <p>
      I am using here four guiding values, and one success metric that is linked with our vision 
        <br /> as well as the factor of time sensitivity to weigh in on the priority
      </p>
        </header>

        <div className="weight-panel">
          <h2 className="weight-section-title">Team Values</h2>
          <div className="weight-grid team-values-grid">
            {CRITERIA.slice(0, 4).map(renderWeightInput)}
          </div>
          <div className="weight-grid additional-weights-grid">
            {CRITERIA.slice(4).map(renderWeightInput)}
          </div>
        </div>

       {/* <div style={{ display: 'flex', gap: '12px', marginBottom: '24px', fontSize: '12px' }}>
          <a href="?" style={{ color: IS_DEMO ? '#8a7f6a' : '#c7967d' }}>
            Blank tool
          </a>
          <a href="?mode=demo" style={{ color: IS_DEMO ? '#c7967d' : '#8a7f6a' }}>
            Filled example
          </a>
        </div>*/}

        {ranked.length > 0 && (
          <div
            className="scoreboard"
          >
            <div className="scoreboard-title">
              Scoreboard
            </div>
            {ranked.map((idea, index) => (
              <a
                key={idea.id}
                href={`#idea-${idea.id}`}
                style={{
                  display: 'flex',
                  alignItems: 'center',
                  gap: '10px',
                  color: '#2b2b26',
                  textDecoration: 'none',
                  fontSize: '13px',
                  padding: '7px 0',
                  borderTop: index === 0 ? 'none' : '1px solid #eee8de',
                }}
              >
                <span style={{ width: '20px', color: '#9c927d', fontVariantNumeric: 'tabular-nums' }}>
                  {index + 1}.
                </span>
                <span style={{ flex: 1 }}>{idea.title || 'Untitled idea'}</span>
                <strong style={{ color: '#c7967d', fontVariantNumeric: 'tabular-nums' }}>
                  {calculatePriority(idea.scores, weights, idea.effort).score.toFixed(2)}
                </strong>
              </a>
            ))}
          </div>
        )}

        {ranked.map((idea) => (
          <IdeaCard
            key={idea.id}
            idea={idea}
            onUpdate={updateIdea}
            onDelete={deleteIdea}
            isTop={idea.id === topId}
            weights={weights}
          />
        ))}

        <button
          onClick={addIdea}
          style={{
            width: '100%',
            padding: '14px',
            background: 'transparent',
            border: '1.5px dashed #c9bda3',
            borderRadius: '10px',
            color: '#8a7f6a',
            fontSize: '14px',
            fontFamily: 'inherit',
            cursor: 'pointer',
            marginTop: '4px',
          }}
        >
          + Add another user story
        </button>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<IdeaScorer />);
</script>
</body>
</html>
